<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradient for the rounded-box background -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow effect for the sparkles -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded rectangle background with shadow-like aesthetic -->
  <rect width="512" height="512" rx="144" fill="url(#bg-gradient)" />
  
  <!-- Subtle inner border for premium glossy look -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="12" />

  <!-- Center sparkles icon with glow -->
  <g transform="translate(96, 96) scale(13.333)" filter="url(#glow)">
    <!-- Main Sparkle -->
    <path d="M12 3l-1.912 5.813a2 2 0 01-1.275 1.275L3 12l5.813 1.912a2 2 0 011.275 1.275L12 21l1.912-5.813a2 2 0 011.275-1.275L21 12l-5.813-1.912a2 2 0 01-1.275-1.275L12 3z" fill="#ffffff" />
    <!-- Secondary Sparkle (top-left) -->
    <path d="M5 3l1 2.5L8.5 6 6 7l-1 2.5L4 7 1.5 6 4 5z" fill="#ffffff" opacity="0.9" />
    <!-- Tertiary Sparkle (bottom-right) -->
    <path d="M19 17l1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1 1-2.5z" fill="#ffffff" opacity="0.9" />
  </g>
</svg>